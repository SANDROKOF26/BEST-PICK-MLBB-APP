<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEST PICK MLBB</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f1015; color: white; text-align: center; margin: 0; padding: 10px; overflow-x: hidden; }
        .container { max-width: 900px; margin: auto; background: #1a1c23; padding: 15px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .main-title {
            font-size: 2.2rem; font-weight: 900; margin-bottom: 15px;
            background: linear-gradient(to bottom, #fff 20%, #ffd700 50%, #b8860b 80%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 2px; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3));
        }

        .slots { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .slot { width: 65px; height: 65px; border: 2px dashed #444; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 9px; overflow: hidden; background: #252830; cursor: pointer; }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
        .slot.filled { border-style: solid; border-color: #ff4444; box-shadow: 0 0 10px rgba(255, 68, 68, 0.4); }

        #hero-search { padding: 12px; width: 95%; border-radius: 8px; border: 1px solid #444; background: #0f1015; color: white; margin-bottom: 15px; outline: none; font-size: 16px; box-sizing: border-box; }

        .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; padding: 10px; justify-items: center; max-height: 350px; overflow-y: auto; background: #12141a; border-radius: 10px; border: 1px solid #333; }
        .hero-card { width: 70px; text-align: center; cursor: pointer; font-size: 11px; }
        
        /* Estilo da caixa de imagem e do fallback interno */
        .img-box {
            width: 55px; height: 55px; border-radius: 8px; border: 2px solid #333;
            background: #2a2e3d; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 4px; overflow: hidden; font-weight: bold; color: #ffd700;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .hero-card:hover .img-box { border-color: #ffd700; }

        .counter-section { margin-top: 20px; padding: 15px; background: #111318; border-radius: 10px; border: 1px solid #333; }
        .counter-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">Best Pick MLBB</div>
    
    <p style="color: #888; font-size: 12px;">TIME INIMIGO (SELECIONE ATÉ 5):</p>
    <div class="slots" id="enemy-slots">
        <div class="slot" onclick="removeHero(0)">+</div>
        <div class="slot" onclick="removeHero(1)">+</div>
        <div class="slot" onclick="removeHero(2)">+</div>
        <div class="slot" onclick="removeHero(3)">+</div>
        <div class="slot" onclick="removeHero(4)">+</div>
    </div>

    <input type="text" id="hero-search" placeholder="🔍 Buscar herói..." oninput="filterHeroes()">

    <div class="hero-grid" id="hero-grid"></div>

    <div class="counter-section">
        <h3 style="color: #4caf50; margin-top: 0;">MELHORES COUNTERS RECOMENDADOS</h3>
        <div class="counter-grid" id="counter-grid">Selecione heróis inimigos para ver os counters.</div>
    </div>
</div>

<script>

        element.style.display = 'none'; // Esconde a tag <img> quebrada
        const parent = element.parentElement;
        parent.innerText = name.substring(0, 2).toUpperCase(); // Coloca as 2 primeiras letras do nome
    }

    const heroesData = [

        { name: "NOLAN", img: "img/NOLAN.png", counters: ["FRANCO", "KAJA", "SABER", "KHUFRA"] },

        { name: "BEATRIX", img: "img/BEATRIX.png", counters: ["NATALIA", "SABER", "LANCELOT", "CHOU"] },
        { name: "BRODY", img: "img/BRODY.png", counters: ["SABER", "NATALIA", "LANCELOT", "LING"] },
        { name: "BRUNO", img: "img/BRUNO.png", counters: ["LESLEY", "CLAUDE", "NATALIA", "HELCURT"] },
        { name: "CLAUDE", img: "img/CLAUDE.png", counters: ["LESLEY", "SABER", "FRANCO", "IRITHEL"] },
        { name: "CLINT", img: "img/CLINT.png", counters: ["BRUNO", "NATAN", "SABER", "NATALIA"] },
        { name: "GRANGER", img: "img/GRANGER.png", counters: ["LANCELOT", "SABER", "CHOU", "NATALIA"] },

        { name: "IXIA", img: "img/IXIA.png", counters: ["LANCELOT", "SABER", "NATALIA", "LING"] },
        { name: "KARRIE", img: "img/KARRIE.png", counters: ["LESLEY", "SABER", "NATALIA", "LANCELOT"] },
        { name: "LAYLA", img: "img/LAYLA.png", counters: ["SABER", "NATALIA", "LANCELOT", "LING"] },

        // LUTADORES
        { name: "ALDOUS", img: "img/ALDOUS.png", counters: ["AKAI", "CHOU", "KAJA", "FRANCO"] },
        { name: "ALPHA", img: "img/ALPHA.png", counters: ["CHOU", "RUBY", "BAXIA", "DYRROTH"] },

        { name: "PAQUITO", img: "img/PAQUITO.png", counters: ["CHOU", "RUBY", "PHOVEUS", "KAJA"] },
        { name: "YU ZHONG", img: "img/YU ZHONG.png", counters: ["BAXIA", "DYRROTH", "KARRIE"] },

        { name: "TIGREAL", img: "img/TIGREAL.png", counters: ["DIGGIE", "CHOU", "FRANCO", "KAJA"] },

        { name: "KHUFRA", img: "img/KHUFRA.png", counters: ["BANE", "HANZO", "ATLAS", "MINOTAURO", "DIGGIE"] },
        { name: "ATLAS", img: "img/ATLAS.png", counters: ["DIGGIE", "MARCEL", "VALENTINA", "FARAMIS", "ALICE"] },
        { name: "BELERICK", img: "img/BELERICK.png", counters: ["KARRIE", "LUNOX", "VALIR"] },
        { name: "MARCEL", img: "img/MARCEL.png", counters: ["ANGELA", "CYCLOPS", "RAFAELA", "YVE", "FLORYN"] },
        { name: "RAFAELA", img: "img/RAFAELA.png", counters: ["LAYLA", "IXIA", "ODETTE", "VALE", "EUDORA"] },
        { name: "FLORYN", img: "img/FLORYN.png", counters: ["LOLITA", "IXIA", "YIN", "SILVANNA", "FRANCO"] },
        { name: "MINOTAURO", img: "img/MINOTAURO.png", counters: ["BAXIA", "HANZO", "IXIA", "VALIR", "ALICE"] },
        { name: "DIGGIE", img: "img/DIGGIE.png", counters: ["ESTES", "CHIP", "HANZO", "HILDA", "YIN"] },
        { name: "LOLITA", img: "img/LOLITA.png", counters: ["AURORA", "HARITH", "ESMERALDA", "ZHUXIN", "MELISSA"] },

        // MAGOS
        { name: "VEXANA", img: "img/VEXANA.png", counters: ["SABER", "NATALIA", "LANCELOT", "LING"] },
        { name: "NANA", img: "img/NANA.png", counters: ["SABER", "NATALIA", "LANCELOT", "LING"] },
        { name: "VALIR", img: "img/VALIR.png", counters: ["SABER", "NATALIA", "LANCELOT", "LING"] },
        { name: "AURORA", img: "img/AURORA.png", counters: ["SABER", "HELCURT", "NATALIA"] },
        { name: "GORD", img: "img/GORD.png", counters: ["NATALIA", "HELCURT", "MATHILDA", "HANZO", "HIRARA"] },
        { name: "EUDORA", img: "img/EUDORA.png", counters: ["BARATS", "ATLAS", "MASHA", "KHUFRA", "SUN"] }
    ];

    let selectedHeroes = [null, null, null, null, null];

    function renderHeroGrid(heroes = heroesData) {
        const grid = document.getElementById('hero-grid');
        grid.innerHTML = '';
        heroes.forEach(hero => {
            const card = document.createElement('div');
            card.className = 'hero-card';
            card.onclick = () => selectHero(hero);
            card.innerHTML = `
                <div class="img-box">
                    <img src="${hero.img}" alt="${hero.name}" onerror="handleImgError(this, '${hero.name}')">
                </div>
                <div>${hero.name}</div>
            `;
            grid.appendChild(card);
        });
    }

    function filterHeroes() {
        const query = document.getElementById('hero-search').value.toLowerCase();
        const filtered = heroesData.filter(h => h.name.toLowerCase().includes(query));
        renderHeroGrid(filtered);
    }

    function selectHero(hero) {
        const emptySlot = selectedHeroes.indexOf(null);
        if (emptySlot !== -1 && !selectedHeroes.includes(hero)) {
            selectedHeroes[emptySlot] = hero;
            updateSlots();
            calculateCounters();
        }
    }

    function removeHero(index) {
        selectedHeroes[index] = null;
        updateSlots();
        calculateCounters();
    }

    function updateSlots() {
        const slots = document.getElementById('enemy-slots').children;
        selectedHeroes.forEach((hero, i) => {
            if (hero) {
                slots[i].className = 'slot filled';
                slots[i].innerHTML = `
                    <div class="img-box" style="width:100%; height:100%; border:none; margin:0;">
                        <img src="${hero.img}" alt="${hero.name}" onerror="handleImgError(this, '${hero.name}')">
                    </div>`;
            } else {
                slots[i].className = 'slot';
                slots[i].innerHTML = '+';
            }
        });
    }

    function calculateCounters() {
        const counterGrid = document.getElementById('counter-grid');
        let allCounters = [];

        selectedHeroes.forEach(hero => {
            if (hero) allCounters.push(...hero.counters);
        });

        if (allCounters.length === 0) {
            counterGrid.innerHTML = "Selecione heróis inimigos para ver os counters.";
            return;
        }

        let counts = {};
        allCounters.forEach(c => counts[c] = (counts[c] || 0) + 1);
        let sortedCounters = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);

        counterGrid.innerHTML = '';
        sortedCounters.slice(0, 6).forEach(counterName => {
            const heroObj = heroesData.find(h => h.name.toUpperCase() === counterName.toUpperCase());
            const imgPath = heroObj ? heroObj.img : `img/${counterName}.png`;
            
            const div = document.createElement('div');
            div.className = 'hero-card';
            div.innerHTML = `
                <div class="img-box">
                    <img src="${imgPath}" alt="${counterName}" onerror="handleImgError(this, '${counterName}')">
                </div>
                <div>${counterName}</div>
            `;
            counterGrid.appendChild(div);
        });
    }

    renderHeroGrid();
</script>

</body>
</html>
